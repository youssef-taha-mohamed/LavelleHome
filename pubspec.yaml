name: lavelle_home
description: "A new Flutter project."
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.12.0
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  font_awesome_flutter: ^11.0.0
  flutter_bloc: ^9.1.1
  pretty_dio_logger: ^1.4.0
  package_info_plus: ^10.2.1
  http: ^1.3.0
  dio: ^5.8.0+1
  equatable: ^2.0.7
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  hive: ^2.2.3
  path_provider: ^2.1.5
  rxdart: ^0.28.0
  app_links: ^7.2.1
  flutter_app_badge: ^2.0.2
  permission_handler: ^12.0.0+1
  flutter_local_notifications: ^20.1.0
  get_it: ^8.0.3
  flutter_svg: ^2.1.0
  force_update_helper: ^0.3.0
  url_launcher: ^6.3.1
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  country_code_picker: ^3.3.0
  easy_loading_button: ^0.3.2
  flutter_screenutil: ^5.9.3
  keyboard_area_handler: ^0.0.1
  pin_code_fields: ^8.0.1
  dropdown_button2: ^2.3.9
  carousel_slider: ^5.1.1
  flutter_expandable_fab: ^2.5.2
  floating_bottom_bar: ^0.0.3
  image_picker: ^1.1.1
  modal_progress_hud_nsn: ^0.5.1
  smooth_page_indicator: ^1.2.1
  fluttertoast: ^9.1.0
  awesome_dialog: ^3.3.0
  timeago: ^3.7.1
  provider: ^6.1.5+1
  showcaseview: ^5.0.1
  webview_flutter: ^4.13.0
  persistent_bottom_nav_bar_v2: ^6.2.0
  dynamic_color: ^1.8.1
  auto_size_text: ^3.0.0
  lottie: ^3.3.2
  jwt_decoder: ^2.0.1
  animated_notch_bottom_bar: ^1.0.4
  connectivity_plus:
  internet_connection_checker_plus:
  new_version_plus: ^1.0.1
  in_app_update: ^5.0.0
  timezone: ^0.10.1
  flutter_timezone: ^5.1.0
  firebase_core: ^4.4.0
  firebase_messaging: ^16.1.1
  firebase_crashlytics: ^5.0.7
  firebase_analytics: ^12.4.5
  firebase_database: ^12.4.6
  flutter_spinkit: ^5.2.2
  image_cropper: ^8.0.2
  country_flags: ^4.1.2
  firebase_remote_config: ^6.5.5
  collection: ^1.19.1
  audioplayers: ^6.8.0
  hive_flutter: ^1.1.0
  requests_inspector: ^5.4.0
  flutter_quill: ^11.5.0
  flutter_html: ^3.0.0
  path: ^1.9.1
  file_picker: ^11.0.2
  google_sign_in_web: ^1.1.3
  google_sign_in_platform_interface: ^3.1.0
  google_sign_in: ^7.2.0
  firebase_auth: ^6.5.6
  sign_in_with_apple: ^8.1.0

dependency_overrides:
  uuid: ^4.4.2
  device_info_plus: 12.4.0
  package_info_plus: 9.0.1
  quill_native_bridge: 11.1.0
  flutter_quill:
    git:
      url: https://github.com/jodinathan/flutter-quill.git
      ref: master


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  change_app_package_name: ^1.5.0

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
    image_path: "assets/images/image/logo.png"
    background_color: "#0175C2"
    theme_color: "#0175C2"
  image_path: "assets/images/image/logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  generate: true


  assets:
    - assets/images/image/
    - assets/images/svg/
    - assets/images/icon/

  fonts:
    - family: Alexandria
      fonts:
        - asset: assets/fonts/Alexandria/Alexandria-Black.ttf
          weight: 900
        - asset: assets/fonts/Alexandria/Alexandria-Bold.ttf
          weight: 700
        - asset: assets/fonts/Alexandria/Alexandria-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Alexandria/Alexandria-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Alexandria/Alexandria-Light.ttf
          weight: 300
        - asset: assets/fonts/Alexandria/Alexandria-Medium.ttf
          weight: 500
        - asset: assets/fonts/Alexandria/Alexandria-Regular.ttf
          weight: 400
        - asset: assets/fonts/Alexandria/Alexandria-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Alexandria/Alexandria-Thin.ttf
          weight: 100

    - family: Rubik
      fonts:
        - asset: assets/fonts/Rubik/Rubik-Black.ttf
          weight: 900
        - asset: assets/fonts/Rubik/Rubik-BlackItalic.ttf
          weight: 900
          style: italic
        - asset: assets/fonts/Rubik/Rubik-Bold.ttf
          weight: 700
        - asset: assets/fonts/Rubik/Rubik-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/Rubik/Rubik-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Rubik/Rubik-ExtraBoldItalic.ttf
          weight: 800
          style: italic
        - asset: assets/fonts/Rubik/Rubik-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Rubik/Rubik-Light.ttf
          weight: 300
        - asset: assets/fonts/Rubik/Rubik-LightItalic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/Rubik/Rubik-Medium.ttf
          weight: 500
        - asset: assets/fonts/Rubik/Rubik-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/Rubik/Rubik-Regular.ttf
          weight: 400
        - asset: assets/fonts/Rubik/Rubik-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Rubik/Rubik-SemiBoldItalic.ttf
          weight: 600
          style: italic

    - family: MyFlutterApp
      fonts:
        - asset: assets/fonts/AppIcons/MyFlutterApp.ttf

    - family: NavBarIcon
      fonts:
        - asset: assets/fonts/AppIcons/NavBarIcon.ttf

    - family: Blog
      fonts:
        - asset: assets/fonts/AppIcons/Blog.ttf

    - family: Chat
      fonts:
        - asset: assets/fonts/AppIcons/Chat.ttf


